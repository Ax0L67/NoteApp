function markdown(text){let code=false;return text.split('\n').map(line=>{if(line.startsWith('```')){code=!code;return code?'<pre><code>':'</code></pre>'}if(code)return esc(line)+'\n';let s=esc(line).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[\[([^\]]+)\]\]/g,(_,v)=>`<button class="wiki" data-wiki="${v}">${v}</button>`).replace(/!\[([^\]]*)\]\((data:image\/(?:png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+)\)/g,'<img alt="$1" src="$2">');if(/^#{1,3} /.test(line)){const level=line.match(/^#+/)[0].length;return `<h${level}>${s.replace(/^#+ /,'')}</h${level}>`}if(/^&gt; /.test(s))return '<blockquote>'+s.slice(5)+'</blockquote>';if(/^- \[[ x]\] /.test(line))return `<p><input type="checkbox" disabled ${line[3]==='x'?'checked':''}> ${s.slice(6)}</p>`;if(/^- /.test(line))return '<p style="margin-bottom:5px">• '+s.slice(2)+'</p>';return s?'<p>'+s+'</p>':'<div style="height:6px"></div>'}).join('')}

const templates={'Пустая заметка':'','Конспект':'## Основные идеи\n\n\n## Подробности\n\n\n## Выводы\n\n\n#обучение','Идея':'## Суть\n\n\n## Следующий шаг\n\n- [ ] \n\n#идеи','Дневниковая запись':'## Что произошло\n\n\n## Мысли\n\n\n## На завтра\n\n- [ ] ','План':'## Цель\n\n\n## Задачи\n\n- [ ] \n- [ ] '};
function newDialog(preset=''){const p=project();modal('Новая заметка',`<form id="new-form"><label>Название<input id="new-name" value="${esc(preset)}" placeholder="Например, Конспект" required></label><label>Папка<select id="new-folder">${p.folders.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label><label>Шаблон<select id="new-template">${[...Object.keys(templates),...p.templates.map(t=>t.name)].map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><footer><button type="button" data-action="cancel">Отмена</button><button class="primary">Создать</button></footer></form>`);$('#new-form').onsubmit=e=>{e.preventDefault();const name=$('#new-name').value.trim();if(!name)return;if(p.notes.some(n=>n.name===name)){toast('Заметка с таким названием уже есть');return}const id=uid(),t=$('#new-template').value;p.notes.push({id,name,folder:$('#new-folder').value,text:templates[t]??p.templates.find(x=>x.name===t)?.text??''});closeModal();openNote(id)}}
function searchDialog(){modal('Поиск',`<input class="search-input" id="search" placeholder="Название или текст…" aria-label="Поиск заметок"><div class="dialog-list" id="search-results"></div><p class="muted" style="margin:16px 0 0">Поиск в проекте «${esc(project().name)}» · Ctrl+K</p>`);const show=()=>{const q=$('#search').value.toLowerCase();$('#search-results').innerHTML=project().notes.filter(n=>(n.name+' '+n.text).toLowerCase().includes(q)).map(n=>`<button data-search-note="${n.id}">${icon('FileText')}<span class="result"><strong>${esc(n.name)}</strong><small>${esc(n.text.slice(Math.max(0,n.text.toLowerCase().indexOf(q)-25),Math.max(0,n.text.toLowerCase().indexOf(q)-25)+110).replace(/\n/g,' '))}</small></span>${icon('ArrowRight')}</button>`).join('')||'<p class="muted">Ничего не найдено.</p>'};$('#search').oninput=show;$('#search').onkeydown=e=>{if(e.key==='Enter')$('#search-results button')?.click()};show()}
function settingsDialog(){const s=project().settings;modal('Оформление проекта',`<p class="muted">Для «${esc(project().name)}». У других проектов свои настройки.</p><div class="setting"><span>Тема</span><select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div><div class="setting"><span>Палитра</span><div class="palette-picker">${Object.entries({graphite:'#696a76',slate:'#5c6e87',sage:'#697e72',sand:'#8c7a66'}).map(([v,c])=>`<button style="background:${c}" data-palette="${v}" class="${s.palette===v?'active':''}" aria-label="Палитра ${v}" title="${{graphite:'Графит',slate:'Сумерки',sage:'Шалфей',sand:'Песок'}[v]}"></button>`).join('')}</div></div><div class="setting"><span>Точечная сетка</span><input type="checkbox" id="dots" ${s.dots!==false?'checked':''} aria-label="Точечная сетка"></div><div class="setting"><span>Размер текста</span><input id="font-size" type="range" min="13" max="23" value="${s.size}" aria-label="Размер текста"><output id="size-value">${s.size}px</output></div><div class="setting"><span>Ширина текста</span><input id="text-width" type="range" min="480" max="980" step="20" value="${s.width}" aria-label="Ширина текста"></div><div class="setting"><span>Свой фон</span><button data-action="background">Загрузить</button><button id="reset-bg">Убрать</button></div><div class="settings-section"><h3>Файлы и шаблоны</h3><div class="setting"><button data-action="import">Импорт .md</button><button data-action="export">Экспорт заметки</button><button data-action="backup">Копия макета</button></div><div class="setting"><button data-action="restore-backup">Восстановить копию</button><button data-action="templates">Шаблоны</button></div><p class="muted">HTML-макет хранит данные в браузере. Локальное хранилище приложения он не изменяет.</p></div><div class="settings-section"><h3>Клавиатура</h3><p class="muted">Ctrl+K — поиск · Ctrl+N — новая заметка<br>Ctrl+E — чтение · Ctrl+Shift+F — фокус<br>Ctrl+S — сохранить · Alt+← / → — история</p></div>`);$('#theme').value=s.theme;$('#theme').onchange=e=>{s.theme=e.target.value;save();applySettings()};$('#dots').onchange=e=>{s.dots=e.target.checked;save();applySettings()};$('#font-size').oninput=e=>{s.size=+e.target.value;$('#size-value').textContent=s.size+'px';save();applySettings()};$('#text-width').oninput=e=>{s.width=+e.target.value;save();applySettings()};$('#reset-bg').onclick=()=>{delete s.background;save();applySettings()}}
function projectsDialog(){modal('Проекты',`<p class="muted">У каждого проекта свои заметки, вкладки и оформление.</p><div class="dialog-list">${state.projects.map(p=>`<button data-open-project="${p.id}">${icon('Stack')}<span class="result"><strong>${esc(p.name)}</strong><small>${p.notes.length} заметок</small></span>${icon('ArrowRight')}</button>`).join('')}</div><form id="project-form"><label>Новый проект<input id="project-name" placeholder="Название проекта" required></label><footer><button class="primary">Создать проект</button></footer></form>`);$('#project-form').onsubmit=e=>{e.preventDefault();const name=$('#project-name').value.trim();if(!name)return;const id=uid();state.projects.push({id,name,notes:[],folders:['Заметки'],tabs:[],recent:[],trash:[],templates:[],settings:{palette:'graphite',dots:true,size:16,width:760,theme:'dark'}});closeModal();switchProject(id);newDialog()}}
function templatesDialog(){modal('Шаблоны',`<label>Шаблон<select id="template-choice">${[...Object.keys(templates).filter(k=>k!=='Пустая заметка'),...project().templates.map(t=>t.name)].map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label>Название<input id="template-name" value="Конспект"></label><label>Текст<textarea id="template-text" rows="10">${esc(templates['Конспект'])}</textarea></label><footer><button id="save-as-template">Из текущей заметки</button><button class="primary" id="save-template">Сохранить шаблон</button></footer>`);$('#template-choice').onchange=e=>{$('#template-name').value=e.target.value;$('#template-text').value=templates[e.target.value]??project().templates.find(t=>t.name===e.target.value)?.text??''};$('#save-as-template').onclick=()=>{if(note()){$('#template-name').value=note().name;$('#template-text').value=note().text}};$('#save-template').onclick=()=>{const name=$('#template-name').value.trim();if(!name)return;project().templates=project().templates.filter(t=>t.name!==name);project().templates.push({name,text:$('#template-text').value});save();toast('Шаблон сохранён')}}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const actions={new:()=>newDialog(),search:searchDialog,settings:settingsDialog,projects:projectsDialog,templates:templatesDialog,cancel:closeModal,inspector:()=>{const e=$('#inspector');e.hidden=!e.hidden;e.classList.add('panel-enter')},focus:()=>$('#shell').classList.toggle('focus'),sidebar:()=>{if(innerWidth<=700)$('#shell').classList.toggle('mobile-nav');else $('#shell').classList.toggle('focus')},daily:()=>{const name=new Date().toLocaleDateString('sv-SE'),p=project(),n=p.notes.find(n=>n.name===name);if(n)openNote(n.id);else{const id=uid();p.notes.push({id,name,folder:'Дневник',text:templates['Дневниковая запись']});if(!p.folders.includes('Дневник'))p.folders.push('Дневник');openNote(id)}},folder:()=>{modal('Новая папка','<form id="folder-form"><label>Название<input id="folder-name" required></label><footer><button class="primary">Создать</button></footer></form>');$('#folder-form').onsubmit=e=>{e.preventDefault();const f=$('#folder-name').value.trim();if(f&&!project().folders.includes(f))project().folders.push(f);save();closeModal();render()}},rename:()=>{if(!note())return;modal('Переименовать заметку',`<form id="rename-form"><label>Название<input id="rename-input" value="${esc(note().name)}" required></label><p class="muted">Ссылки на заметку будут обновлены.</p><footer><button class="primary">Сохранить</button></footer></form>`);$('#rename-form').onsubmit=e=>{e.preventDefault();rename($('#rename-input').value);closeModal()}},delete:()=>{if(!note())return;modal('В корзину?',`<p class="muted">«${esc(note().name)}» можно будет восстановить.</p><footer><button data-action="cancel">Отмена</button><button id="confirm-delete" class="danger">В корзину</button></footer>`);$('#confirm-delete').onclick=()=>{const p=project(),n=note();p.trash.push(n);p.notes=p.notes.filter(x=>x.id!==n.id);p.tabs=p.tabs.filter(id=>id!==n.id);p.activeNote=p.tabs[0]||p.notes[0]?.id;closeModal();save();render();toast('Заметка в корзине')}},trash:()=>{modal('Корзина',`<div class="dialog-list">${project().trash.map(n=>`<div>${icon('FileText')}<span class="result"><strong>${esc(n.name)}</strong><small>${esc(n.folder)}</small></span><button data-restore="${n.id}" title="Восстановить">${icon('ArrowCounterClockwise')}<span>Восстановить</span></button></div>`).join('')||'<p class="muted">Корзина пуста.</p>'}</div>`)},attach:()=>$('#attachment').click(),background:()=>$('#background-file').click(),import:()=>$('#import-file').click(),export:()=>{if(note())download(note().name+'.md','# '+note().name+'\n\n'+note().text,'text/markdown')},backup:()=>download('NoteApp-design-backup.json',JSON.stringify(state,null,2),'application/json'),'restore-backup':()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const next=JSON.parse(await f.files[0].text());if(!Array.isArray(next.projects)||!next.projects.every(p=>Array.isArray(p.notes)&&Array.isArray(p.tabs)&&p.settings))throw Error();state=next;save();closeModal();render();toast('Копия макета восстановлена')}catch{toast('Не удалось прочитать копию макета')}};f.click()},'history-back':()=>travel(-1),'history-forward':()=>travel(1),favorite:()=>$('#favorite').click()};
function travel(d){const i=historyIndex+d;if(i<0||i>=history.length)return;const h=history[i];if(!state.projects.find(p=>p.id===h.project)?.notes.some(n=>n.id===h.note))return;historyIndex=i;state.active=h.project;openNote(h.note,false)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action){$('#menu').hidden=true;actions[b.dataset.action]?.()}if(b.dataset.project)switchProject(b.dataset.project);if(b.dataset.openProject){switchProject(b.dataset.openProject);closeModal()}if(b.dataset.closeProject){state.openProjects=state.openProjects.filter(id=>id!==b.dataset.closeProject);if(!state.openProjects.length){state.openProjects.push(b.dataset.closeProject);toast('Оставьте хотя бы один проект открытым')}else if(state.active===b.dataset.closeProject)state.active=state.openProjects[0];save();render()}if(b.dataset.note)openNote(b.dataset.note);if(b.dataset.searchNote){closeModal();openNote(b.dataset.searchNote)}if(b.dataset.closeNote){const p=project();p.tabs=p.tabs.filter(id=>id!==b.dataset.closeNote);if(p.activeNote===b.dataset.closeNote)p.activeNote=p.tabs.at(-1);save();render()}if(b.dataset.folder!==undefined){collapsed.has(b.dataset.folder)?collapsed.delete(b.dataset.folder):collapsed.add(b.dataset.folder);render()}if(b.dataset.view){view=b.dataset.view;tag='';render()}if(b.dataset.tag){tag=tag===b.dataset.tag?'':b.dataset.tag;render()}if(b.dataset.palette){project().settings.palette=b.dataset.palette;save();applySettings();settingsDialog()}if(b.dataset.wiki){const n=project().notes.find(n=>n.name===b.dataset.wiki);n?openNote(n.id):newDialog(b.dataset.wiki)}if(b.dataset.restore){const p=project(),n=p.trash.find(n=>n.id===b.dataset.restore);if(p.notes.some(x=>x.name===n.name))n.name+=' (восстановлено)';p.notes.push(n);p.trash=p.trash.filter(x=>x.id!==n.id);save();render();actions.trash();toast('Заметка восстановлена')}if(b.dataset.offset){reading=false;renderContent();const el=$('#editor');el.focus();el.setSelectionRange(+b.dataset.offset,+b.dataset.offset);el.scrollTop=el.value.slice(0,+b.dataset.offset).split('\n').length*27}if(b.dataset.format){const f=b.dataset.format;const formats={bold:['**','**'],italic:['*','*'],strike:['~~','~~'],code:['\n```\n','\n```\n'],link:['[[',']]','Название заметки'],list:['\n- ','','Пункт списка'],ordered:['\n1. ','','Пункт списка'],check:['\n- [ ] ','','Задача'],table:['\n| Столбец | Столбец |\n| --- | --- |\n| ',' | Значение |\n','Значение']};insert(...formats[f])}});
$('#heading').onchange=e=>insert('\n'+e.target.value,'','Заголовок');$('#edit-mode').onclick=()=>{reading=false;renderContent()};$('#read-mode').onclick=()=>{reading=true;renderContent()};$('#more').onclick=e=>{const m=$('#menu');m.innerHTML=[['rename','PencilSimple','Переименовать'],['favorite','Star','Избранное'],['attach','Paperclip','Добавить вложение'],['templates','SquaresFour','Шаблоны'],['export','DownloadSimple','Экспорт .md'],['import','UploadSimple','Импорт .md'],['backup','Copy','Резервная копия'],['delete','Trash','В корзину']].map(([a,i,t])=>`<button data-action="${a}" class="${a==='delete'?'danger':''}">${icon(i)}${t}</button>`).join('');const r=e.currentTarget.getBoundingClientRect();m.style.top=(r.bottom+7)+'px';m.style.right=Math.max(15,innerWidth-r.right)+'px';m.hidden=!m.hidden};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#more'))$('#menu').hidden=true});$('#close-dialog').onclick=closeModal;$('#dialog').onclick=e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}};
async function addFiles(files){for(const file of files){if(file.size>5*1024*1024){toast('Для макета выберите файл до 5 МБ');continue}if(file.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{insert('\n!['+file.name+']('+r.result+')\n','','');toast('Изображение добавлено')};r.readAsDataURL(file)}else insert('\n['+file.name+'](attachments/'+file.name+')\n','','');}toast('Вложение добавлено в макет')}
$('#attachment').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#import-file').onchange=async e=>{for(const f of e.target.files){project().notes.push({id:uid(),name:f.name.replace(/\.md|\.markdown$/g,''),folder:'Импорт',text:await f.text()})}if(!project().folders.includes('Импорт'))project().folders.push('Импорт');save();render();closeModal();toast('Markdown-файлы добавлены в макет');e.target.value=''};$('#background-file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024){toast('Выберите изображение до 3 МБ');return}const r=new FileReader();r.onload=()=>{project().settings.background=r.result;save();applySettings();toast('Фон проекта изменён')};r.readAsDataURL(f)};$('#canvas').ondragover=e=>e.preventDefault();$('#canvas').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};$('#canvas').onpaste=e=>{const files=[...e.clipboardData.items].filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();addFiles(files)}};
$$('.resize').forEach(el=>{el.onpointerdown=e=>{const side=el.dataset.side,start=e.clientX,width=parseInt(getComputedStyle(document.documentElement).getPropertyValue(side==='left'?'--left':'--right'));el.setPointerCapture(e.pointerId);el.onpointermove=p=>document.documentElement.style.setProperty('--'+side,Math.max(210,Math.min(360,width+(p.clientX-start)*(side==='left'?1:-1)))+'px');el.onpointerup=()=>el.onpointermove=null};el.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){const k='--'+el.dataset.side,w=parseInt(getComputedStyle(document.documentElement).getPropertyValue(k));document.documentElement.style.setProperty(k,Math.max(210,Math.min(360,w+(e.key==='ArrowRight'?10:-10)))+'px')}}});
document.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey;if(mod&&['k','n','e','s'].includes(e.key.toLowerCase())){e.preventDefault();const k=e.key.toLowerCase();if(k==='k')searchDialog();if(k==='n')newDialog();if(k==='e'){reading=!reading;renderContent()}if(k==='s'){save();toast('Макет сохранён')}}if(mod&&e.shiftKey&&e.key.toLowerCase()==='f'){e.preventDefault();actions.focus()}if(e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();travel(e.key==='ArrowLeft'?-1:1)}if(e.key==='Escape'){$('#menu').hidden=true;$('#shell').classList.remove('focus','mobile-nav')}});
$('#about').onclick=()=>modal('О макете','<p class="muted">Отдельный HTML-прототип нового дизайна NoteApp. Здесь можно переключать проекты и вкладки, писать заметки, искать, пробовать корзину и менять оформление.</p><p class="muted">Данные макета сохраняются в браузере. Исходное приложение и его Markdown-файлы не затрагиваются. В настольной версии каждый проект будет отдельной папкой хранилища.</p>');
bindEditor();icons();render();
</script></body></html>
