<!doctype html><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NoteApp isolated code runtime</title>
<script>
'use strict';
// This document runs with an opaque origin (iframe sandbox="allow-scripts").
// It never evaluates note text. Only the trusted bootstrap becomes a Worker.
addEventListener('message',function start(event){
  if(event.source!==parent||event.data?.type!=='start'||!event.ports[0])return;
  removeEventListener('message',start);
  const port=event.ports[0];let worker,url;
  const stop=()=>{worker?.terminate();if(url)URL.revokeObjectURL(url);port.close()};
  port.onmessage=event=>{if(event.data?.type==='stop')stop()};
  try{
    url=URL.createObjectURL(new Blob([event.data.bootstrap],{type:'text/javascript'}));
    worker=new Worker(url);
    worker.onmessage=event=>port.postMessage(event.data);
    worker.onerror=event=>{port.postMessage({type:'error',text:event.message||'Worker failed'});stop()};
    worker.postMessage(event.data.payload);
  }catch(error){port.postMessage({type:'error',text:String(error)});stop()}
});
parent.postMessage({type:'noteapp-sandbox-ready'},'*');
</script>
